name: Formatting Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6

      - name: Run clang-format style check for C/C++ programs.
        uses: jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: "22"
